[project]
name = "gameskill-fql"
version = "0.1.0"
description = "DINOv3 + EAT game policy trained with Flow Q-Learning"
requires-python = ">=3.11"
dependencies = [
  "datasets>=5.0",
  "onnx>=1.18",
  "onnxruntime>=1.20",
  "pillow>=11.0",
  "pyyaml>=6.0",
  "soundfile>=0.13",
  "tensorboard>=2.21.0",
  "timm>=1.0.20",
  "torch>=2.3",
  "torchaudio>=2.3",
  # EAT's Hugging Face custom code targets the Transformers 4.x API.
  "transformers>=4.51,<5",
]

[tool.uv]
package = false
